name: Ci/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Princípio do menor privilégio
permissions:
  contents: read

jobs:

  # ======================
  # 1. Secret Scanning
  # ======================
  gitleaks:
    name: 1. Secret Scanning
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository # Baixar repo
        uses: actions/checkout@v4 
        with:
          fetch-depth: 0 # pega historico completo

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3 # executa action do gitleak, ferramenta que procura padroes e credenciais e outros segredos do códiigo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ======================
  # 2. SAST
  # ======================
  # Analisa o código-fonte da aplicação em busca
  # de possíveis vulnerabilidades de segurança
  # sem precisar executar a aplicação

  sast:
    name: 2. SAST com Semgrep
    runs-on: ubuntu-latest

    permissions:
       contents: read # Menor privilégio

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep scan --config p/javascript

  # ======================
  # 3. Qualidade e Validação de Código
  # ======================
  quality:
    name: 3. Code Quality & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: cpm ci

      - name: Validação de Lint (Oxlint)
        run: npm run lint

      - name: Checagem estática de tipos (TypeScript)
        run: npm run typecheck

      - name: Build da aplicação
        run: npx vite build

